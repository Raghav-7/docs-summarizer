name: Docs Summarizer CI

# Defines the events that trigger this workflow
on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

# Restrict default permissions to read-only for repository contents (Security Best Practice)
permissions:
  contents: read

# Concurrency group ensures that duplicate runs on the same branch cancel previous in-progress runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Offline Unit & Integration Tests
    runs-on: ubuntu-latest # GitHub-hosted standard Ubuntu Linux runner

    steps:
      # Step 1: Check out the repository source code
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Step 2: Set up Python 3.11 with pip caching enabled
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip' # Caches ~/.cache/pip based on requirements.txt hash

      # Step 3: Upgrade pip and install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run the offline test suite using standard unittest
      - name: Execute Offline Test Suite
        env:
          # Dummy values ensure environment completeness without leaking secrets or calling APIs
          APP_SECRET_KEY: ci-test-secret-key-12345
          GEMINI_API_KEY: ""
          GROQ_API_KEY: ""
        run: |
          python -m unittest discover -s tests -v
